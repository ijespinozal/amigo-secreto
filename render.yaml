# Blueprint de Render: backend (API) y frontend (sitio estático).
# Render no ofrece MySQL gestionado: la base debe ser externa (Aiven, TiDB,
# Railway, etc.). Las variables con `sync: false` se completan en el
# Dashboard al crear el Blueprint y nunca se guardan en el repositorio.
#
# Las URLs públicas dependen del `name` de cada servicio (si el nombre está
# tomado, Render agrega un sufijo). Tras el primer despliegue verificar que:
#   - CORS_ORIGIN (API)         = URL del sitio estático, sin "/" final.
#   - VITE_URL_SERVER (frontend) = URL de la API + "/api".
services:
  - type: web
    name: amigo-secreto-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    # Aplica migraciones pendientes y el bootstrap del admin antes de arrancar.
    # En planes de pago puede moverse a `preDeployCommand: npm run db:migrate`.
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: amigo-secreto
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # SPA: React Router resuelve las rutas en el navegador. Sin esta regla,
    # recargar /user/home (o abrir un enlace directo) devuelve 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Los assets de Vite llevan hash en el nombre: se pueden cachear para siempre.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # index.html nunca se cachea, para que cada despliegue se vea al instante.
      - path: /index.html
        name: Cache-Control
        value: no-cache
    envVars:
      # Tiene prioridad sobre frontend/.env.production.
      - key: VITE_URL_SERVER
        value: https://amigo-secreto-api.onrender.com/api
